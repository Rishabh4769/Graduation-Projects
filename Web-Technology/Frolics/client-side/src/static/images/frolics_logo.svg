<?xml version="1.0" encoding="UTF-8"?>
<!-- Frolics logo: scalable SVG with icon + wordmark -->
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="120" viewBox="0 0 400 120" role="img" aria-labelledby="title desc">
  <title id="title">Frolics logo</title>
  <desc id="desc">Stylized F icon and wordmark for Frolics event management platform.</desc>
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="f1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#0b1220" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Icon: rounded square with F -->
  <g transform="translate(20,10)">
    <rect x="0" y="0" width="80" height="80" rx="18" ry="18" fill="url(#g1)" filter="url(#f1)" />
    <path d="M32 24 C26 24 22 28 22 34 L22 46 C22 52 26 56 32 56 L48 56 C54 56 58 52 58 46 L58 44 C58 44 58 40 54 38 C50 36 46 36 42 36 L36 36 C34 36 32 34 32 32 L32 24 Z M36 28 L46 28 C48 28 50 30 50 32 L50 34" fill="#fff" opacity="0.98" />
  </g>

  <!-- Wordmark -->
  <g transform="translate(120,70)">
    <text x="0" y="0" font-family="Poppins, Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial" font-weight="800" font-size="40" fill="url(#g1)">FROLICS</text>
  </g>
</svg>
