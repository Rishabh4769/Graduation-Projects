<?xml version="1.0" encoding="utf-8"?>
<!-- Frolics — full logo: emblem + wordmark. Designed for college events: mortarboard, confetti and energetic colors -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-labelledby="title desc">
  <title id="title">Frolics — College Events Logo</title>
  <desc id="desc">Emblem with mortarboard, confetti and vibrant gradient wordmark reading FROLICS.</desc>
  <defs>
    <linearGradient id="lg-blend" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <linearGradient id="lg-word" x1="0" x2="1">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0b1220" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="soft-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0b1220" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- emblem (left) -->
  <g transform="translate(40,20)">
    <!-- background circle -->
    <circle cx="80" cy="80" r="80" fill="url(#lg-blend)" filter="url(#soft-shadow)" />

    <!-- mortarboard (cap) -->
    <g transform="translate(0,10)">
      <polygon points="20,70 80,40 140,70 80,95" fill="#0b1220" opacity="0.95" />
      <rect x="70" y="68" width="20" height="18" rx="3" ry="3" fill="#0b1220" opacity="0.95" />
      <!-- tassel -->
      <path d="M95 62 L110 76" stroke="#ffd166" stroke-width="4" stroke-linecap="round" />
      <circle cx="112" cy="78" r="3.5" fill="#ffd166" />
    </g>

    <!-- stylized F monogram inside the circle (subtle) -->
    <g transform="translate(44,36)">
      <path d="M8 68 L8 32 L28 32 L28 40 L18 40 L18 46 L28 46 L28 54 L18 54 L18 68 Z" fill="#ffffff" opacity="0.95" />
    </g>

    <!-- confetti dots -->
    <g transform="translate(0,0)">
      <circle cx="20" cy="18" r="3" fill="#fff" opacity="0.9" />
      <circle cx="140" cy="28" r="4" fill="#ffd166" opacity="0.95" />
      <circle cx="32" cy="130" r="3" fill="#7c3aed" opacity="0.95" />
    </g>
  </g>

  <!-- wordmark -->
  <g transform="translate(210,140)">
    <text x="0" y="0" font-family="Poppins, Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial" font-weight="800" font-size="64" fill="url(#lg-blend)">FROLICS</text>
    <text x="0" y="44" font-family="Poppins, Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial" font-weight="600" font-size="20" fill="#6b7280">College Events • Workshops • Competitions</text>
  </g>

</svg>
